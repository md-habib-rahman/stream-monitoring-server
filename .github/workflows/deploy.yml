name: Deploy hls-monitor to Production

on:
  push:
    branches:
      - main

jobs:
  # Job 1: Continuous Integration (Verify code & dependencies before touching the server)
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Match your server's Node version (e.g., 18, 20, or 22)
          cache: 'npm'

      - name: Verify clean dependency install
        run: npm ci

  # Job 2: Continuous Deployment (Only runs if Job 1 succeeds)
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e  # Stop immediately if any command fails

            # 1. Navigate to your project directory
            cd /opt/stream-monitoring-server

            # 2. Load NVM / Node environment so npm and pm2 are found in non-interactive SSH
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            # 3. Force-sync with GitHub (eliminates "local changes" errors permanently)
            git fetch origin main
            git reset --hard origin/main

            # 4. Clean install production dependencies without modifying package-lock.json
            npm ci --omit=dev

            # 5. Restart your single-instance PM2 process with updated environment variables
            pm2 restart hls-monitor --update-env